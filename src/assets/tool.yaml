alphavantage:  
  identity:
    author: Mạnh Đỗ
    name: alphavantage
    label:
      vi_VN: AlphaVantage
      en_US: AlphaVantage
      zh_Hans: AlphaVantage
      pt_BR: AlphaVantage
    description:
      en_US: AlphaVantage là một nền tảng trực tuyến cung cấp dữ liệu thị trường tài chính và API, giúp các nhà đầu tư cá nhân và nhà phát triển dễ dàng truy cập vào báo giá cổ phiếu, chỉ báo kỹ thuật và phân tích cổ phiếu.
      zh_Hans: AlphaVantage是一个在线平台，它提供金融市场数据和API，便于个人投资者和开发者获取股票报价、技术指标和股票分析。
      pt_BR: AlphaVantage is an online platform that provides financial market data and APIs, making it convenient for individual investors and developers to access stock quotes, technical indicators, and stock analysis.
    icon: https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR5QZuQaZ8qCYe7R4wez297mVRqQxDNbXFItQ&s
    tags:
      - finance
  credentials_for_provider:
    api_key:
      type: secret-input
      required: true
      label:
        vi_VN: AlphaVantage API key
        en_US: AlphaVantage API key
        zh_Hans: AlphaVantage API key
        pt_BR: AlphaVantage API key
      placeholder:
        vi_VN: Vui lòng nhập AlphaVantage API key của bạn.
        en_US: Please input your AlphaVantage API key
        zh_Hans: 请输入你的 AlphaVantage API key
        pt_BR: Please input your AlphaVantage API key
      help:
        vi_VN: Lấy AlphaVantage API key của bạn từ trang web AlphaVantage.
        en_US: Get your AlphaVantage API key from AlphaVantage
        zh_Hans: 从 AlphaVantage 获取您的 AlphaVantage API key
        pt_BR: Get your AlphaVantage API key from AlphaVantage
      url: https://www.alphavantage.co/support/#api-key
  query_stock:
    identity:
      name: query_stock
      author: Mạnh Đỗ
      label:
        vi_VN: query_stock
        en_US: query_stock
        zh_Hans: query_stock
        pt_BR: query_stock
    description:
      human:
        vi_VN: Truy xuất thông tin như giá mở cửa hàng ngày, giá cao nhất trong ngày, giá thấp nhất trong ngày, giá đóng cửa hàng ngày và khối lượng giao dịch hàng ngày cho một mã cổ phiếu được chỉ định.
        en_US: Retrieve information such as daily opening price, daily highest price, daily lowest price, daily closing price, and daily trading volume for a specified stock symbol.
        zh_Hans: 获取指定股票代码的每日开盘价、每日最高价、每日最低价、每日收盘价和每日交易量等信息。
        pt_BR: Retrieve information such as daily opening price, daily highest price, daily lowest price, daily closing price, and daily trading volume for a specified stock symbol
      llm: Retrieve information such as daily opening price, daily highest price, daily lowest price, daily closing price, and daily trading volume for a specified stock symbol
    parameters:
      - name: code
        type: string
        required: true
        label:
          vi_VN: stock code
          en_US: stock code
          zh_Hans: 股票代码
          pt_BR: stock code
        human_description:
          vi_VN: stock code
          en_US: stock code
          zh_Hans: 股票代码
          pt_BR: stock code
        llm_description: stock code for query from alphavantage
        form: llm
arxiv: 
  identity:
    author: Mạnh Đỗ
    name: arxiv
    label:
      en_US: ArXiv
      vi_VI: ArXiv
      zh_Hans: ArXiv
      ja_JP: ArXiv
    description:
      en_US: Access to a vast repository of scientific papers and articles in various fields of research.
      vi_VI: Truy cập vào một kho lưu trữ khổng lồ các bài báo khoa học và bài viết trong nhiều lĩnh vực nghiên cứu.
      zh_Hans: 访问各个研究领域大量科学论文和文章的存储库。
      ja_JP: 多様な研究分野の科学論文や記事の膨大なリポジトリへのアクセス。
    icon: https://avatars.githubusercontent.com/u/45442578?s=280&v=4
    tags:
      - search
  arxiv_search:
    identity:
      name: arxiv_search
      author: Mạnh Đỗ
      label:
        en_US: Arxiv Search
        vi_VI: Tìm kiếm Arxiv
        zh_Hans: Arxiv 搜索
        ja_JP: Arxiv 検索
    description:
      human:
        en_US: A tool for searching scientific papers and articles from the Arxiv repository. Input can be an Arxiv ID or an author's name.
        vi_VI: Công cụ tìm kiếm các bài báo khoa học và bài viết từ kho Arxiv. Đầu vào có thể là ID Arxiv hoặc tên tác giả.
        zh_Hans: 一个用于从Arxiv存储库搜索科学论文和文章的工具。 输入可以是Arxiv ID或作者姓名。
        ja_JP: Arxivリポジトリから科学論文や記事を検索するためのツールです。入力はArxiv IDまたは著者名にすることができます。
      llm: A tool for searching scientific papers and articles from the Arxiv repository. Input can be an Arxiv ID or an author's name.
    parameters:
      - name: query
        type: string
        required: true
        label:
          en_US: Query string
          vi_VI: Chuỗi truy vấn
          zh_Hans: 查询字符串
          ja_JP: クエリ文字列
        human_description:
          en_US: The Arxiv ID or author's name used for searching.
          vi_VI: ID Arxiv hoặc tên tác giả được sử dụng để tìm kiếm.
          zh_Hans: 用于搜索的Arxiv ID或作者姓名。
          ja_JP: 検索に使用されるArxiv IDまたは著者名。
        llm_description: The Arxiv ID or author's name used for searching.
        form: llm
chart:
  identity:
    author: Mạnh Đỗ
    name: chart
    label:
      vi_VI: ChartGenerator
      en_US: ChartGenerator
      zh_Hans: 图表生成
      pt_BR: Gerador de gráficos
    description:
      vi_VI: Trình tạo biểu đồ là một công cụ để tạo các biểu đồ thống kê như biểu đồ cột, biểu đồ đường, biểu đồ tròn, v.v.
      en_US: Chart Generator is a tool for generating statistical charts like bar chart, line chart, pie chart, etc.
      zh_Hans: 图表生成是一个用于生成可视化图表的工具，你可以通过它来生成柱状图、折线图、饼图等各类图表
      pt_BR: O Gerador de gráficos é uma ferramenta para gerar gráficos estatísticos como gráfico de barras, gráfico de linhas, gráfico de pizza, etc.
    icon: https://i.pinimg.com/originals/e1/0a/1c/e10a1c7f6a17b9806b5cadf9e42b0596.gif
    tags:
      - design
      - productivity
      - utilities
  line: 
    identity:
      name: line
      author: Mạnh Đỗ
      label:
        vi_VI: Biểu đồ đường thẳng
        en_US: Linear Chart
        zh_Hans: 线性图表
        pt_BR: Gráfico linear
      icon: icon.svg
    description:
      human:
        vi_VI: Biểu đồ đường thẳng
        en_US: linear chart
        zh_Hans: 线性图表
        pt_BR: Gráfico linear
      llm: generate a linear chart with input data
    parameters:
      - name: data
        type: string
        required: true
        label:
          vi_VI: dữ liệu
          en_US: data
          zh_Hans: 数据
          pt_BR: dados
        human_description:
          vi_VI: Dữ liệu để tạo biểu đồ, mỗi số nên được ngăn cách bằng dấu ';'.
          en_US: data for generating chart, each number should be separated by ";"
          zh_Hans: 用于生成线性图表的数据，每个数字之间用 ";" 分隔
          pt_BR: dados para gerar gráfico linear, cada número deve ser separado por ";"
        llm_description: data for generating linear chart, data should be a string contains a list of numbers like "1;2;3;4;5"
        form: llm
      - name: x_axis
        type: string
