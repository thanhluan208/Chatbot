stability:
  identity:
    author: Dify
    name: stability
    label:
      en_US: Stability
      zh_Hans: Stability
      pt_BR: Stability
    description:
      en_US: Activating humanity's potential through generative AI
      zh_Hans: 通过生成式 AI 激活人类的潜力
      pt_BR: Activating humanity's potential through generative AI
    icon: https://www.appypie.com/endpoint/wp-content/uploads/stability-ai.png
    tags:
      - image
  credentials_for_provider:
    api_key:
      type: secret-input
      required: true
      label:
        en_US: API key
        zh_Hans: API key
        pt_BR: API key
      placeholder:
        en_US: Please input your API key
        zh_Hans: 请输入你的 API key
        pt_BR: Please input your API key
      help:
        en_US: Get your API key from Stability
        zh_Hans: 从 Stability 获取你的 API key
        pt_BR: Get your API key from Stability
      url: https://platform.stability.ai/account/keys
  edit_remove_background:
    identity:
      name: edit_remove_background
      author: Mạnh Đỗ
      label:
        vi_VI: BackgroundRemoval
        en_US: BackgroundRemoval
    description:
      human:
        vi_VI: Xóa nền phân đoạn chính xác phần tiền cảnh từ hình ảnh và thực hiện việc xóa nền.
        en_US: The Remove Background service accurately segments the foreground from an image and implements and removes the background.
      llm: The Remove Background service accurately segments the foreground from an image and implements and removes the background.
    parameters:
      - name: image
        type: string
        required: true
        label:
          vi_VI: Ảnh
          en_US: Image
        human_description:
          vi_VI: Hình ảnh mà bạn muốn xóa nền.
          en_US: The image whose background you wish to remove.
        llm_description: The image whose background you wish to remove.
        form: llm
      - name: output_format
        type: select
        options:
          - value: png
            label:
              vi_VI: png
              en_US: png
          - value: jpeg
            label:
              vi_VI: jpeg
              en_US: jpeg
          # - value: webp  # ##TODO: Not ready yet
          #   label:
          #     vi_VI: webp
          #     en_US: webp
        required: true
